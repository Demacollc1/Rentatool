let mode='oficio', curFilter='__all__', showEsp=false, q='';
const app=document.getElementById('app');
// flatten
const ALL=[];
Object.keys(DATA).forEach(t=>DATA[t].forEach(r=>ALL.push({...r,trade:t})));
// stats
let tot=ALL.length, ok=ALL.filter(r=>r.status==='ok').length, esp=ALL.filter(r=>r.status==='especializada').length, pd=ALL.filter(r=>r.status==='pordef').length;
document.getElementById('stats').innerHTML=
 `<div class="stat"><b>${tot}</b>equipos</div><div class="stat"><b>${ok}</b>con producto</div>`+
 `<div class="stat"><b>${pd}</b>por definir</div><div class="stat"><b>${esp}</b>especializadas</div>`+
 `<div class="stat"><b>${Object.keys(DATA).length}</b>oficios</div>`;
const tfs=document.getElementById('tfs');
function keysFor(){ return mode==='oficio'?Object.keys(DATA):[...new Set(ALL.map(r=>r.grupo))].sort(); }
function buildFilters(){
  let b=`<button class="tf on" data-t="__all__">Todos</button>`;
  keysFor().forEach(k=>b+=`<button class="tf" data-t="${k}">${k}</button>`);
  tfs.innerHTML=b;
}
tfs.onclick=e=>{if(!e.target.dataset.t)return;curFilter=e.target.dataset.t;[...tfs.children].forEach(x=>x.classList.toggle('on',x.dataset.t===curFilter));render();};
document.querySelector('.modebar').onclick=e=>{if(!e.target.dataset.m)return;mode=e.target.dataset.m;curFilter='__all__';
  [...document.querySelectorAll('.modebtn')].forEach(x=>x.classList.toggle('on',x.dataset.m===mode));buildFilters();render();};
document.getElementById('q').oninput=e=>{q=e.target.value.toLowerCase();render();};
document.getElementById('showesp').onchange=e=>{showEsp=e.target.checked;render();};
function money(v){return v.toLocaleString('en-US',{maximumFractionDigits:0});}
function card(o,cls,label,alt){
 if(!o)return `<div class="card ${cls} empty">— sin opción en esta gama —</div>`;
 const rent=Math.round(o.cost*0.20), sem=Math.round(o.cost*0.70), mes=Math.round(o.cost*2.00);
 const brand=o.brand?`<span class="brand">${o.brand}</span>`:'';
 const more=o.n>1?`<span class="more">+${o.n-1} opciones</span>`:'';
 const b87=o.b87>0?`<span class="b87 si">B87: ${o.b87}</span>`:(o.cost>0?`<span class="b87 no">sin B87</span>`:`<span class="b87 no" style="color:#c98a3a">Importar</span>`);
 const money2=o.cost>0?`<span class="money cost">$${money(o.cost)}<small> costo</small></span><span class="money rent">$${rent}<small>día</small></span><span class="money rent" style="color:#5fd4e0">$${money(sem)}<small>semana</small></span><span class="money rent" style="color:#c9a0ff">$${money(mes)}<small>mes</small></span>`:`<span class="money cost" style="color:#c98a3a">n/d<small> costo · definir</small></span>`;
 return `<div class="card ${cls}"><div class="lab">${label}</div><div class="code">${o.code}${brand}</div>
   <div class="dsc">${o.desc}</div><div class="foot">${money2}${b87}${more}</div>${altHtml(o,alt)}</div>`;
}
function altHtml(o,alt){
 if(!alt)return '';
 const oIn=/IN|INALAMBR|(?:12|18|20|40|54|60)V/i.test(o.desc);
 const cls=oIn?'cb':'in'; const pw=oIn?'⚡ También cableada':'🔋 También inalámbrica';
 const rent=alt.cost>0?` · $${Math.round(alt.cost*0.2)}/día`:'';
 return `<div class="altline ${cls}"><span class="pw">${pw}:</span> <code>${alt.code}</code> ($${alt.cost}${rent})</div>`;
}
function cardVenta(o){
 if(!o)return `<div class="card ind empty">— sin producto —</div>`;
 return `<div class="card ind solo"><div class="lab">Venta · ${o.brand}</div><div class="code">${o.code}<span class="brand">${o.brand}</span></div>
   <div class="dsc">${o.desc}</div><div class="foot"><span class="money cost">$${money(o.cost)}<small> costo</small></span><span class="b87 venta">EPP · venta</span></div></div>`;
}
function toolHead(r,showGrupo){
 let cons='';
 if(r.cons_codes&&r.cons_codes.length){
   const chips=r.cons_codes.map(c=>`<span class="cchip"><b>${c.code}</b> · $${c.cost}</span>`).join('');
   cons=`<div class="conslabel">Consumibles:</div><div class="conschips">${chips}</div>`;
 } else if(r.cons){ cons=`<div class="cons"><b>Consumibles:</b> ${r.cons}</div>`; }
 const gt=showGrupo?'':`<span class="gtag">${r.grupo}</span>`;
 return `<div class="toolh"><div class="nm">${r.tool}</div><div class="sp">${r.spec||''}</div>${cons}${gt}</div>`;
}
function rowHtml(r,inGroupView){
 const th=toolHead(r,inGroupView);
 if(r.status==='especializada') return `<div class="row esp">${th}<div class="espnote"><b>Especializada.</b> No existe en DeWalt/Craftsman/Stanley — equipo pesado o marca especializada.</div></div>`;
 if(r.status==='pordef') return `<div class="row pordef">${th}<div class="pordefnote"><b>Por definir.</b> Categoría creada — aún no la tienen / importar.</div></div>`;
 if(r.status==='venta') return `<div class="row pordef">${th}${cardVenta(r.ind)}</div>`;
 return `<div class="row">${th}${card(r.ind,'ind','Industrial · '+((r.ind&&r.ind.brand)||'DeWalt'),r.ind_alt)}${card(r.diy,'diy','DIY · '+(r.diy?r.diy.brand:'—'),r.diy_alt)}</div>`;
}
function render(){
 let h='';
 const groups = mode==='oficio' ? Object.keys(DATA).map(t=>[t,DATA[t].map(r=>({...r,trade:t}))]) 
   : [...new Set(ALL.map(r=>r.grupo))].sort().map(g=>[g,ALL.filter(r=>r.grupo===g)]);
 groups.forEach(([name,items])=>{
   if(curFilter!=='__all__'&&curFilter!==name)return;
   let rows=items.filter(r=>{
     if(r.status==='especializada'&&!showEsp)return false;
     if(q&&!r.tool.toLowerCase().includes(q))return false;
     return true;});
   if(!rows.length)return;
   h+=`<div class="trade"><h2>${name}<span>${rows.length}</span></h2>`;
   let lastSub=null;
   rows.forEach(r=>{
     const sub=(mode==='oficio')?(r.sub||null):null;
     if(sub!==lastSub){ if(sub) h+=`<div class="subhead">${sub}</div>`; lastSub=sub; }
     h+=rowHtml(r, mode==='grupo');
   });
   h+='</div>';
 });
 app.innerHTML=h||'<p style="color:#666;padding:20px">Sin resultados.</p>';
}
buildFilters();render();
</script>
